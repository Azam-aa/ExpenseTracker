name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Release Keystore Properties
        run: |
          mkdir -p keystore
          echo "key.store=../../keystore/release.keystore" > keystore/keystore.properties
          echo "key.store.password=ExpensesOfflineSafe2026!" >> keystore/keystore.properties
          echo "key.alias=daytodayexpenses" >> keystore/keystore.properties
          echo "key.alias.password=ExpensesOfflineSafe2026!" >> keystore/keystore.properties

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Copy & Rename Release APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/DayToDayExpenses-Release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayToDayExpenses-Release-APK
          path: build-output/DayToDayExpenses-Release.apk
          retention-days: 30
